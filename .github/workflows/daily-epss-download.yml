name: Daily EPSS Download

on:
  schedule:
    # Run daily at 1:30 PM UTC / 7:30 AM Central (EPSS scores are published around 1:30 PM UTC)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      download_all:
        description: 'Download all historical files'
        required: false
        default: 'false'
        type: boolean
      start_date:
        description: 'Start date for range download (YYYY-MM-DD)'
        required: false
        type: string
      end_date:
        description: 'End date for range download (YYYY-MM-DD)'
        required: false
        type: string

jobs:
  download-epss:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      
      - name: Download EPSS files
        run: |
          if [ "${{ github.event.inputs.download_all }}" == "true" ]; then
            echo "Downloading all historical EPSS files..."
            python scripts/download_epss.py --all --output-dir data
          elif [ -n "${{ github.event.inputs.start_date }}" ]; then
            echo "Downloading EPSS files for date range..."
            END_DATE_ARG=""
            if [ -n "${{ github.event.inputs.end_date }}" ]; then
              END_DATE_ARG="--end ${{ github.event.inputs.end_date }}"
            fi
            python scripts/download_epss.py --start "${{ github.event.inputs.start_date }}" $END_DATE_ARG --output-dir data
          else
            # Scheduled runs can start many hours late (past midnight UTC), so
            # `--today` could ask for a file that isn't published yet and skip
            # the previous day. Fetch a trailing window instead: existing files
            # are skipped and a not-yet-published day is tolerated.
            echo "Downloading any missing EPSS files from the last 7 days..."
            python scripts/download_epss.py \
              --start "$(date -u -d '7 days ago' +%F)" \
              --end "$(date -u +%F)" \
              --output-dir data

            # The range download tolerates gaps, so fail loudly if data goes stale.
            LATEST=$(ls data/*/*/epss_scores-*.csv.gz | sort | tail -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
            if [[ "$LATEST" < "$(date -u -d '2 days ago' +%F)" ]]; then
              echo "::error::Newest EPSS file is $LATEST; nothing published for 2+ days"
              exit 1
            fi
          fi
      
      - name: Check for changes
        id: git-check
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Get today's date for the commit message
          DOWNLOAD_DATE=$(date +%Y-%m-%d)
          
          git commit -m "Add EPSS scores for ${DOWNLOAD_DATE}" -m "Automated daily EPSS data download"
          git push
